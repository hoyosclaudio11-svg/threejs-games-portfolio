<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mantis Guardian: Nest Defense | Three.js Action Survival 3D</title>
    <meta name="description" content="Juego de acción y supervivencia 3D en Three.js. Defiende la ooteca como una mantis religiosa contra oleadas de insectos invasores." />
    <!-- Google Fonts for Gaming HUD -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        user-select: none;
        -webkit-user-select: none;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body, html, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050b07;
        font-family: 'Rajdhani', sans-serif;
      }
      .font-gaming {
        font-family: 'Orbitron', sans-serif;
      }
      canvas {
        display: block;
        outline: none;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 25, 15, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: #10b981;
        border-radius: 3px;
      }
    </style>
  </head>
  <body class="bg-black text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
